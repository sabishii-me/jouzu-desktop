[package]
name = "jouzu-desktop"
default-run = "jouzu-desktop"
version = "1.0.3"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "jouzu-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

semver = "1"
url = "2"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

# The renderer failure record reads WebView2's own event, which Tauri hands over through with_webview.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

# Non-blocking runtime pipes and process-group termination for the chat supervisor.
[target.'cfg(unix)'.dependencies]
libc = "0.2"


