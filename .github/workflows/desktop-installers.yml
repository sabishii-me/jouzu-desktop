name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build target
        type: choice
        options:
          - both
          - windows
          - macos
        default: both

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: inputs.platform != 'macos'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Install frontend dependencies
        run: npm ci --prefix apps/launcher
      - name: Frontend tests and build
        run: |
          npm --prefix apps/launcher run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix apps/launcher test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native tests
        working-directory: apps/launcher/src-tauri
        run: cargo test --locked --bins
      - name: Build Windows installer
        working-directory: apps/launcher
        run: npx tauri build --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jouzu-desktop-windows-installer
          path: apps/launcher/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    if: inputs.platform != 'windows'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Install frontend dependencies
        run: npm ci --prefix apps/launcher
      - name: Frontend tests and build
        run: |
          npm --prefix apps/launcher run build
          npm --prefix apps/launcher test
      - name: Native tests
        working-directory: apps/launcher/src-tauri
        run: cargo test --locked --bins
      - name: Build macOS installer
        working-directory: apps/launcher
        run: npx tauri build --bundles dmg
      - name: Upload macOS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jouzu-desktop-macos-installer
          path: apps/launcher/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
