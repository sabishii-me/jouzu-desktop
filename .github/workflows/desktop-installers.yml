name: Desktop installers

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build target
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
        default: all

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Install frontend dependencies
        run: npm ci --prefix apps/launcher
      - name: Frontend tests and build
        run: |
          npm --prefix apps/launcher run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix apps/launcher test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Native tests
        working-directory: apps/launcher/src-tauri
        run: cargo test --locked --bins
      - name: Build Windows installer
        working-directory: apps/launcher
        run: npx tauri build --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jouzu-desktop-windows-installer
          path: apps/launcher/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Install frontend dependencies
        run: npm ci --prefix apps/launcher
      - name: Frontend tests and build
        run: |
          npm --prefix apps/launcher run build
          npm --prefix apps/launcher test
      - name: Native tests
        working-directory: apps/launcher/src-tauri
        run: cargo test --locked --bins
      - name: Add the Apple Silicon target
        run: rustup target add aarch64-apple-darwin
      - name: Build macOS installer
        working-directory: apps/launcher
        run: npx tauri build --target aarch64-apple-darwin --bundles dmg
      - name: Upload macOS installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jouzu-desktop-macos-installer
          path: apps/launcher/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm ci --prefix apps/launcher
      - name: Frontend tests and build
        run: |
          npm --prefix apps/launcher run build
          npm --prefix apps/launcher test
      - name: Native tests
        working-directory: apps/launcher/src-tauri
        run: cargo test --locked --bins
      - name: Build Linux installers
        working-directory: apps/launcher
        run: npx tauri build --bundles appimage,deb
      - name: Upload Linux installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: jouzu-desktop-linux-installers
          path: |
            apps/launcher/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/launcher/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14

