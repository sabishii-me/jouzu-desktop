name: Desktop release

# Jouzu Desktop is its own product: a Tauri shell plus the chat UI and its
# installer. It is not the launcher that ships Jouzu, and these gates are the
# desktop's own (ADR 0006), not the launcher's.
#
# Build gate: typecheck, unit tests, chat/session acceptance tests, native tests,
# and an unsigned NSIS build. Signing and the feed are release steps only.
# Release gate adds: the updater configuration, the signature, notes, and the
# published feed. Runtime provisioning is still open (0065); until it lands a
# shell-only release cannot start chat on a clean machine.
#
# Manual until the first release exists. `publish` is the only path that writes to
# the repository: it creates `v<version>` and replaces the feed on the stable
# `desktop-update` release. Without `publish`, the run only proves the build and
# keeps a workflow artifact.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; must match apps/launcher/package.json
        required: true
        type: string
        default: '1.0.3'
      notes:
        description: Release notes for the feed; empty uses the CHANGELOG section when it exists
        required: false
        type: string
        default: ''
      publish:
        description: Create the version release and replace the desktop-update feed
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# A release is never cancelled by a later dispatch: the feed and the release assets are
# replaced in place, and a half-written feed would be served to every installed client.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Check the dispatched version
        id: check
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$(node -p "require('./apps/launcher/package.json').version")"
          if [ "$version" != "$INPUT_VERSION" ]; then
            echo "::error::Input version $INPUT_VERSION does not match apps/launcher/package.json ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Install frontend dependencies
        run: npm ci --prefix apps/launcher
      - name: Install the acceptance browser
        working-directory: apps/launcher
        run: npx playwright install chromium
      - name: Frontend build, unit tests and acceptance tests
        run: npm --prefix apps/launcher run test:acceptance
      - name: Native tests
        working-directory: apps/launcher/src-tauri
        run: cargo test --locked --bins
      - name: Build the installer
        working-directory: apps/launcher
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ('${{ inputs.publish }}' -eq 'true') {
            # createUpdaterArtifacts is a build-time overlay, so the release always
            # produces the .sig the feed points at.
            $overlay = Join-Path $env:RUNNER_TEMP 'updater.json'
            '{"bundle":{"createUpdaterArtifacts":true}}' | Set-Content -LiteralPath $overlay -Encoding utf8NoBOM
            npx tauri build --bundles nsis --config $overlay
          } else {
            # A test build proves the installer without the signing key.
            npx tauri build --bundles nsis
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Name and verify the installer
        working-directory: apps/launcher
        run: |
          $version = '${{ needs.prepare.outputs.version }}'
          $directory = 'src-tauri/target/release/bundle/nsis'
          $built = Join-Path $directory "Jouzu Desktop_${version}_x64-setup.exe"
          $asset = Join-Path $directory "JouzuDesktop_${version}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $built)) { throw 'The installer was not produced' }
          Copy-Item -LiteralPath $built -Destination $asset -Force
          if ('${{ inputs.publish }}' -eq 'true') {
            if (-not (Test-Path -LiteralPath "$built.sig")) { throw 'The updater signature was not produced' }
            Copy-Item -LiteralPath "$built.sig" -Destination "$asset.sig" -Force
            $publicKey = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
            node ../../packaging/launcher/verify-updater-signature.mjs $asset "$asset.sig" $publicKey
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          "$((Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLower())  JouzuDesktop_${version}_x64-setup.exe" |
            Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii
      - name: Stage the release artifacts flat
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory $stage -Force | Out-Null
          Get-ChildItem apps/launcher/src-tauri/target/release/bundle/nsis -Filter 'JouzuDesktop_*' |
            Copy-Item -Destination $stage
          Copy-Item apps/launcher/SHA256SUMS.txt $stage
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, windows]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: desktop-release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Check the updater configuration
        shell: bash
        run: |
          node - <<'NODE'
          const updater = require('./apps/launcher/src-tauri/tauri.conf.json').plugins?.updater;
          if (!updater?.pubkey) throw new Error('The updater public key is not configured');
          const endpoint = String(updater.endpoints?.[0] ?? '');
          if (!/^https:\/\/github\.com\/[^/]+\/[^/]+\/releases\/download\/desktop-update\/latest\.json$/.test(endpoint)) {
            throw new Error(`Unexpected update endpoint: ${endpoint}`);
          }
          NODE
      - name: Download the Windows artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name windows-release --dir release
      - name: Write the release notes and the feed
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          version='${{ needs.prepare.outputs.version }}'
          asset="JouzuDesktop_${version}_x64-setup.exe"
          if [ -n "$INPUT_NOTES" ]; then
            printf '%s\n' "$INPUT_NOTES" > notes.md
          elif node packaging/launcher/launcher-notes.mjs CHANGELOG.md "$version" > notes.md 2>/dev/null; then
            :
          else
            printf 'Jouzu Desktop %s\n' "$version" > notes.md
          fi
          node packaging/launcher/desktop-feed.mjs "$version" notes.md "$GITHUB_REPOSITORY" "$asset" "release/$asset.sig" latest.json
          cat latest.json
      - name: Publish the version release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ needs.prepare.outputs.version }}'
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Jouzu Desktop $version" --notes-file notes.md
          fi
          gh release upload "$tag" \
            "release/JouzuDesktop_${version}_x64-setup.exe" \
            "release/JouzuDesktop_${version}_x64-setup.exe.sig" \
            "release/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --clobber
      - name: Replace the update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view desktop-update --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create desktop-update --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Jouzu Desktop update feed" --notes "Signed desktop update feed. Do not delete."
          fi
          gh release upload desktop-update latest.json --repo "$GITHUB_REPOSITORY" --clobber
      - name: Verify the feed and the asset are anonymously readable
        run: |
          endpoint="https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-update/latest.json"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$endpoint" -o published.json; then break; fi
            sleep 3
          done
          cmp latest.json published.json
          asset="$(node -p "require('./published.json').platforms['windows-x86_64'].url")"
          curl -fsSL -o /dev/null "$asset"
